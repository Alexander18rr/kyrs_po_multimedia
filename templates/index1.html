<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сборка компьютера: материнская плата</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 20px;
    }
    h2 {
      color: #0056b3;
      margin-top: 0;
    }
    .board-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-bottom: 30px;
    }
    .board-box {
      position: relative;
      display: inline-block;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 15px;
      border: 2px solid #d5e6f7;
    }
    .board-img {
      max-width: 470px;
      height: auto;
      display: block;
    }
    .pin {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #ffd500;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      border: 2px solid #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #333;
      transition: box-shadow 0.2s;
    }
    .pin.active {
      box-shadow: 0 0 0 5px #80e27e;
    }
    .pin.solved {
      background: #80e27e;
      color: #fff;
      border-color: #5ab852;
    }
    .selector {
      margin-top: 30px;
      text-align: center;
    }
    .selector label {
      font-size: 17px;
      margin-right: 10px;
    }
    .selector select {
      font-size: 16px;
      padding: 8px;
      margin-right: 10px;
    }
    .selector button {
      background: #0056b3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      padding: 7px 18px;
      cursor: pointer;
      margin-left: 10px;
    }
    .selector button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .feedback {
      font-size: 18px;
      font-weight: bold;
      margin-top: 24px;
      text-align: center;
    }
    .reset-btn {
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      padding: 7px 16px;
      cursor: pointer;
      margin: 23px auto 0;
      display: block;
    }
    .back-btn {
      background: #17a2b8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      padding: 10px 25px;
      cursor: pointer;
      margin: 25px auto 10px;
      display: none;
      text-align: center;
    }
    .back-btn.show {
      display: block;
      animation: btn-fade-in 0.6s;
    }
    @keyframes btn-fade-in {
      from { opacity: 0; transform: scale(0.8);}
      to   { opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>
  <h2>Сборка компьютера: укажи компоненты на плате</h2>
  <div class="board-container">
    <div class="board-box">
      <img src="https://dbimg.eu/i/JQulL5x6.jpg" alt="Материнская плата" class="board-img" id="mb-img">
      <div class="pin" style="top:135px; left:190px;" data-pin="cpu" title="Узел"></div>
      <div class="pin" style="top:32px; left:295px;" data-pin="ram" title="Узел"></div>
      <div class="pin" style="top:175px; left:342px;" data-pin="storage" title="Узел"></div>
      <div class="pin" style="top:270px; left:220px;" data-pin="video" title="Узел"></div>
      <div class="pin" style="top:255px; left:360px;" data-pin="battery" title="Узел"></div>
    </div>
  </div>

  <div class="selector">
    <label>Выбери узел:</label>
    <span id="node-label">---</span><br><br>
    <select id="device-select" disabled>
      <option value="">Выбери компонент...</option>
      <option value="cpu">Процессор</option>
      <option value="ram">Оперативная память</option>
      <option value="storage">Запоминающие устройства</option>
      <option value="video">Видеокарта</option>
      <option value="battery">Батарейка CMOS</option>
    </select>
    <button id="apply-btn" disabled>Применить</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="reset-btn" id="resetBtn">Начать заново</button>
  <button class="back-btn" id="backBtn" onclick="window.location.href='/'">На первую страницу</button>
</body>
</html>
