<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ЭВМ и периферийные устройства</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<header>
  <h1>ЭВМ и периферийные устройства</h1>
  <p>Мультимедийное пособие по дисциплине Информатика и вычислительная техника</p>
</header>

<div class="content">
  <!-- Ваш существующий контент тут -->

  <!-- Новые круглые карточки -->
  <div class="card-container" id="cardContainer">
    <div class="card">
      <div class="card-text">Процессор</div>
    </div>
    <div class="card">
      <div class="card-text">Оперативная память</div>
    </div>
    <div class="card">
      <div class="card-text">Устройства ввода и вывода</div>
    </div>
    <div class="card">
      <div class="card-text">Запоминающие устройства</div>
    </div>
  </div>


<!-- Навигационное меню слева -->
<div id="nav-menu" style="position: fixed; left: 20px; top: 100px; width: 200px; background: #f0f8ff; border: 1px solid #ccc; border-radius: 8px; padding: 10px; z-index: 100;">
  <h3>Содержание</h3>
  <ul id="nav-list" style="list-style: none; padding: 0; margin: 0;">
    <!-- Сюда автоматически добавятся ссылки на h1 -->
  </ul>
</div>

<!-- Кнопка прокрутки вверх справа -->
<button id="scroll-top" style="position: fixed; right: 20px; bottom: 20px; width: 50px; height: 50px; background: #0056b3; color: white; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 100;">↑</button>



<footer>
  <p>© 2025 Информатика и вычислительная техника</p>
</footer>
<div id="infoModal" class="modal hidden">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <div id="modalImageContainer"></div>
    <div id="modalText"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
